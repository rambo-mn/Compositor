# Builds, tests and packages Compositor for Windows on a Windows machine. Every push that touches windows/ runs the
# checks and uploads the installer and portable .exe as workflow artifacts; pushing a tag v<version> (the version in
# windows/package.json) also publishes them, with the update feed Help > Check for Updates reads, as a GitHub release.
name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Cache the background-removal model
        uses: actions/cache@v4
        with:
          path: windows/resources/models
          key: isnet-general-use-60920e99

      - name: Fetch the background-removal model
        run: npm run fetch-model

      - name: End-to-end tests
        run: npm run e2e

      - name: Package (and publish, for a version tag)
        run: |
          node scripts/build.mjs --production
          npx electron-builder --win --x64 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows
          path: |
            windows/release/*.exe
            windows/release/latest.yml
          if-no-files-found: error
